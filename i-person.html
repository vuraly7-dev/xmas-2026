/* ===== 音效：全部由程式即時合成（鍵盤聲、提示音），不使用任何音效檔 ===== */
const SFX=(()=>{
  let ctx=null,out=null,noise=null,on=true,unlocked=false;
  function iosUnlock(){
    try{ const sr=8000,len=sr/2,buf=new ArrayBuffer(44+len*2),v=new DataView(buf);
      const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
      w(0,"RIFF");v.setUint32(4,36+len*2,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
      v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,len*2,true);
      const a=new Audio(URL.createObjectURL(new Blob([buf],{type:"audio/wav"}))); a.loop=true; a.setAttribute("playsinline",""); a.volume=.01; a.play().catch(()=>{});
    }catch(e){}
  }
  function ensure(){
    if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)(); out=ctx.createGain(); out.gain.value=.5; out.connect(ctx.destination);
      const len=ctx.sampleRate*.05; noise=ctx.createBuffer(1,len,ctx.sampleRate); const d=noise.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3); }
    if(!unlocked){ unlocked=true; iosUnlock(); }
    if(ctx.state!=="running") ctx.resume();
  }
  function key(t,vol){
    const s=ctx.createBufferSource(); s.buffer=noise; s.playbackRate.value=.8+Math.random()*.5;
    const bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2200+Math.random()*1800; bp.Q.value=1.2;
    const g=ctx.createGain(); g.gain.value=vol*(.7+Math.random()*.5);
    s.connect(bp).connect(g).connect(out); s.start(t);
    const o=ctx.createOscillator(), og=ctx.createGain(); o.frequency.value=140+Math.random()*40;
    og.gain.setValueAtTime(vol*.5,t); og.gain.exponentialRampToValueAtTime(.0001,t+.04);
    o.connect(og).connect(out); o.start(t); o.stop(t+.05);
  }
  function tone(f1,f2,t,len,type,vol){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type||"sine";
    o.frequency.setValueAtTime(f1,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+len*.8);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+len);
    o.connect(g).connect(out); o.start(t); o.stop(t+len+.03);
  }
  const P={
    type(n){ const t=ctx.currentTime; let x=0; for(let i=0;i<n;i++){ x+=.045+Math.random()*.05; key(t+x,.35); } },
    pop(){ const t=ctx.currentTime; tone(880,0,t,.08,"sine",.18); tone(1320,0,t+.06,.12,"sine",.18); },
    boom(){ const t=ctx.currentTime; tone(160,60,t,.6,"sine",.45); tone(320,120,t,.3,"triangle",.12); },
    tap(){ const t=ctx.currentTime; key(t,.5); tone(1200,0,t,.06,"sine",.12); },
    title(){ const t=ctx.currentTime; tone(523.25,0,t,.6,"sine",.16); tone(783.99,0,t+.12,.7,"sine",.14); },
    down(){ const t=ctx.currentTime; tone(660,330,t,.35,"triangle",.18); },
    up(){ const t=ctx.currentTime; tone(440,880,t,.3,"sine",.2); tone(880,1320,t+.12,.25,"sine",.12); },
    end(){ const t=ctx.currentTime; [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,0,t+i*.13,.6,"sine",.2)); },
    drain(){ const t=ctx.currentTime; tone(440,110,t,.8,"sawtooth",.08); tone(220,55,t+.1,.8,"sine",.25); }
  };
  return {
    play(name,arg){ if(!on) return; try{ ensure(); P[name](arg); }catch(e){} },
    unlock(){ try{ ensure(); }catch(e){} },
    toggle(){ on=!on; return on; },
    pause(h){ if(!ctx) return; try{ h? ctx.suspend() : ctx.resume(); }catch(e){} }
  };
})();

  next:"終於……回到家了。"},
 {t:"回家", d:"12/25・聖誕節", e:"🛋️", bg:"#1a1410",
  lines:[["n","打開家門。好安靜。"],["n","你倒在沙發上。"],["i","你","今天，我活下來了。"],["n","手機又震了一下。群組：「今天好好玩～明年再辦！」"]],
  q:"最後一個決定：",
  c:[["關機。躺平。聖誕快樂。","世界與我無關",30,-8,"你睡了 11 個小時。這是今年最好的聖誕禮物。"],
     ["在脆上發文：「今日社交額度已用完」","引起 i 人大共鳴",12,4,"收到 2,300 個讚，全是 i 人。你們彼此懂。"],
     ["回群組：「好好玩！明年我還要主持！」","你已經不是當初的你了",-10,14,"群組瞬間爆炸。你被列為明年的負責人。"]],
  next:null}
];

let S;
function start(){
  S = {batt:100, e:0, ep:0, log:[], picks:[]};
  $("hud").style.visibility="hidden";
  $("bg").style.background="radial-gradient(ellipse at 50% 20%,#3a0d16,transparent 70%)";
  $("screen").innerHTML = `
    <div class="cover">
      <div class="k">原創互動微短劇・全 7 集</div>
      <h1>i 人的<br><em>聖誕生存</em>指南</h1>
      <p>公司聖誕派對，全員強制參加。<br>你的社交電量只有 <b style="color:#fff">100%</b>。<br>每一個選擇，都會消耗或回復電量。</p>
      <div class="eps">${EP.map((_,i)=>`<div>EP${i+1}</div>`).join("")}</div>
      <div class="rule">⚡ 電量歸零 → 觸發「速閃結局」</div>
      <div class="rule" style="font-size:12px">🔊 有鍵盤打字音效，右上角可關閉</div>
      <div class="rule" style="font-size:11px;opacity:.7">※ 劇情與角色純屬虛構，如有雷同純屬巧合・© 2026 liva</div>
    </div>`;
  $("dock").innerHTML = `<button class="btn" id="go">▶ 開始第 1 集</button>`;
  $("go").onclick = ()=>{ SFX.unlock(); SFX.play("tap"); episode(0); };
}

function setBatt(v){
  S.batt = Math.max(0, Math.min(100, v));
  $("bfill").style.width = S.batt+"%";
  $("bfill").style.background = S.batt>50?"var(--green)":S.batt>20?"var(--gold)":"var(--red)";
  $("btxt").textContent = S.batt+"%";
  const b=$("batt"); b.classList.remove("low"); void b.offsetWidth; if(S.batt<=20) b.classList.add("low");
}

async function episode(i){
  S.ep=i; const ep=EP[i];
  $("hud").style.visibility="visible"; $("eptag").textContent=`EP.${i+1} / 7`;
  setBatt(S.batt);
  $("bg").style.background=`radial-gradient(ellipse at 50% 15%,${ep.bg},transparent 75%)`;
  $("dock").innerHTML="";
  $("screen").innerHTML=`<div class="tcard"><div class="n">第 ${i+1} 集</div><h2>${ep.t}</h2><div class="d">${ep.d}</div></div>`;
  SFX.play("title");
  await sleep(1500);
  $("screen").innerHTML=`<div class="big-emoji">${ep.e}</div><div class="lines" id="lines"></div>`;
  const L=$("lines");
  for(const ln of ep.lines){
    const d=document.createElement("div");
    if(ln[0]==="n") { d.className="line nar"; d.textContent=ln[1]; }
    else if(ln[0]==="B") { d.className="line big"; d.textContent=ln[1]; }
    else if(ln[0]==="s") { d.className="line say"; d.innerHTML=`<b>${ln[1]}</b>${ln[2]}`; }
    else { d.className="line inner"; d.innerHTML=`<b>（內心）</b>${ln[2]}`; }
    L.appendChild(d); $("screen").scrollTop=1e9;
    if(ln[0]==="B") SFX.play("boom"); else if(ln[0]==="s") SFX.play("pop"); else SFX.play("type", Math.min(12, Math.ceil((ln[2]||ln[1]).length/2)));
    await sleep(ln[0]==="B"?1300:950);
  }
  const q=document.createElement("div"); q.className="line nar"; q.style.color="#fff"; q.style.fontStyle="normal"; q.style.fontWeight="700"; q.textContent=ep.q;
  L.appendChild(q); $("screen").scrollTop=1e9;
  $("dock").innerHTML = ep.c.map((c,k)=>`<button class="choice" data-k="${k}" style="animation-delay:${k*.08}s">${c[0]}<small>${c[1]}</small></button>`).join("");
  $("dock").querySelectorAll(".choice").forEach(b=>b.onclick=()=>{ SFX.play("tap"); choose(i,+b.dataset.k); });
}

async function choose(i,k){
  const ep=EP[i], c=ep.c[k];
  $("dock").innerHTML="";
  const L=$("lines");
  const me=document.createElement("div"); me.className="line inner"; me.innerHTML=`<b>你選擇了</b>${c[0]}`; L.appendChild(me);
  await sleep(500);
  const r=document.createElement("div"); r.className="line nar"; r.textContent=c[4]; L.appendChild(r);
  await sleep(400);
  const dl=document.createElement("div"); dl.className="delta "+(c[2]<0?"minus":"plus");
  dl.textContent=`社交電量 ${c[2]>=0?"+":""}${c[2]}%`; L.appendChild(dl);
  S.e += c[3]; S.picks.push(c[0]);
  setBatt(S.batt + c[2]); S.log.push(S.batt);
  SFX.play(c[2]<0?"down":"up");
  $("screen").scrollTop=1e9;
  await sleep(700);
  if(S.batt<=0){ SFX.play("drain"); return ending(true); }
  if(ep.next){
    const t=document.createElement("div"); t.className="teaser"; t.innerHTML=`<span>下集預告</span>${ep.next}`; L.appendChild(t);
    $("screen").scrollTop=1e9;
    $("dock").innerHTML=`<button class="btn" id="nx">▶ 看第 ${i+2} 集</button>`;
    $("nx").onclick=()=>{ SFX.play("tap"); episode(i+1); };
  } else {
    $("dock").innerHTML=`<button class="btn" id="nx">🎬 看我的結局</button>`;
    $("nx").onclick=()=>{ SFX.play("end"); ending(false); };
  }
}

function ending(drained){
  // e 度：把累積 e 分數映射到 0–100
  const ePct = Math.round(Math.max(3, Math.min(97, 35 + S.e*0.55)));
  let title, sub, desc, tags;
  if(drained){
    title="電量耗盡・速閃結局"; sub=`在第 ${S.ep+1} 集默默消失`;
    desc=`你在「${EP[S.ep].t}」那一刻電量歸零，悄悄從派對消失。沒有人發現你離開，這正是 i 人的最高境界。回家路上的便利商店，是你今晚最溫暖的地方。`;
    tags=["#速閃大師","#社交電量0%","#隱形技能滿點"];
  } else if(ePct>=65){
    title="隱藏版 e 人"; sub="披著 i 人外皮的派對動物";
    desc="你嘴上說自己是 i 人，但今晚主持、唱歌、搶麥一樣沒少。真相是：你只是需要一個藉口。明年的派對負責人，非你莫屬。";
    tags=["#其實是e人","#派對救星","#明年主持人"];
  } else if(ePct>=45){
    title="適應型 ie 人"; sub="該社交時社交，該消失時消失";
    desc="你懂得在必要時切換 e 人模式，也知道什麼時候該躲進廁所充電。這是職場最高級的生存技能：電量管理大師。";
    tags=["#ie人","#電量管理大師","#職場生存王"];
  } else {
    title="純血 i 人"; sub="守住了自己的電量與尊嚴";
    desc="全場最安靜，但你活下來了，而且電量還有剩。你不需要別人的掌聲，回家關機的那一刻，就是你的聖誕奇蹟。";
    tags=["#純血i人","#回家就是勝利","#今日社交額度已用完"];
  }
  S.result={title,ePct};
  $("hud").style.visibility="hidden";
  $("bg").style.background="radial-gradient(ellipse at 50% 10%,#3a0d16,transparent 70%)";
  const bars = S.log.map((v,i)=>`<div style="height:${Math.max(4,v)}%;background:${v>50?"#2fbf71":v>20?"#f4c95d":"#e3263f"}"><span>EP${i+1}</span></div>`).join("");
  $("screen").innerHTML=`
    <div class="res">
      <div class="k">你的結局</div>
      <h2>${title}</h2>
      <div class="sub">${sub}</div>
      <p>${desc}</p>
      <div class="meter">
        <div class="lab"><span>你的 e 度</span><b>${ePct}%</b></div>
        <div class="ie"><i id="dot"></i></div>
        <div class="ie-ends"><span>i 人</span><span>e 人</span></div>
      </div>
      <div class="meter">
        <div class="lab"><span>每集社交電量</span><b>剩 ${S.batt}%</b></div>
        <div class="spark">${bars}</div>
      </div>
      <div class="tags">${tags.map(t=>`<span>${t}</span>`).join("")}</div>
      <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:14px">e 度純屬娛樂，並非心理測驗或人格評估<br>© 2026 liva</div>
    </div>`;
  setTimeout(()=>{ const d=$("dot"); if(d) d.style.left=ePct+"%"; },120);
  $("dock").innerHTML=`<button class="btn" id="sh">複製結果，找朋友比 e 度 👀</button><button class="btn ghost" id="re">重看一次，換條路線</button>`;
  $("re").onclick=()=>{ SFX.play("tap"); start(); };
  $("sh").onclick=async()=>{
    const txt=`我在《i 人的聖誕生存指南》打出「${title}」結局！\ne 度 ${ePct}%，社交電量剩 ${S.batt}% 🔋\n${tags.join(" ")}\n你是哪一種？留友看 🎄${shareUrl()}`;
    try{ await navigator.clipboard.writeText(txt); toast("已複製！貼給朋友比比看 🎄"); }
    catch(e){ toast("無法自動複製，截圖分享也可以 📸"); }
  };
}

function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2400); }
$("snd").onclick=()=>{ const on=SFX.toggle(); $("snd").textContent=on?"🔊":"🔇"; if(on) SFX.play("tap"); };
start();
</script>
</body>
</html>
