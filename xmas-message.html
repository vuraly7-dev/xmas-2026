  function iosUnlock(){

  }
  let sfxOut=null, unlocked=false;
  function ensure(){
    if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)();

  function tone(f1,f2,t,len,type,vol){

  const L=LV[i];
  $("gi").textContent=L.icon; $("gn").textContent=L.name; $("gs").textContent=L.sub; $("lv").textContent=`第 ${i+1} / ${LV.length} 關`;
  $("readers").innerHTML=L.readers.map((r,k)=>`<div class="rd" id="rd${k}"><div class="av">${r[1]}<span class="mood" id="md${k}"></span></div>${r[0]}</div>`).join("");
  $("chat").innerHTML=`<div class="sysm"><span>12 月 24 日 晚上 8:00</span></div><div class="sysm"><span>${["主管","班長","媽媽"][i]||"有人"}：今天大家記得說聖誕快樂喔～</span></div>`;
  $("sheet").classList.remove("show");
  renderComp();
  try{ window.scrollTo(0,0); }catch(e){}
}

function msgText(){ return pick.map((p,s)=>p===null?null:LV[cur].slots[s][p][0]); }
function renderComp(){
  const L=LV[cur], t=msgText(), full=t.every(x=>x!==null);
  const left=t.filter(x=>x===null).length;
  const pv = t.some(x=>x!==null)? t.map(x=>x??"＿＿").join(" ") : "從上面三排各選一句，組成你的祝福";
  $("chat").classList.toggle("tall", busy);
  if(busy){
    $("comp").innerHTML=""; $("comp").style.display="none"; $("sendbar").style.display="none";
    return;
  }
  $("comp").style.display=""; $("sendbar").style.display="";
  $("comp").innerHTML=`
    ${L.slots.map((sl,s)=>`<div class="slot"><div class="lab">${SLOT[s]}${pick[s]===null?" ・請選一句":" ✓"}</div><div class="tiles">${sl.map((tl,k)=>`<button type="button" class="tile ${pick[s]===k?"on":""}" data-s="${s}" data-k="${k}">${tl[0]}</button>`).join("")}</div></div>`).join("")}
    <div class="tries">已傳 ${tries} 次</div>`;
  $("sendbar").innerHTML=`<div class="prow"><div class="preview ${full?"full":""}">${pv}</div><button type="button" class="sendb" id="send" ${full?"":"disabled"}>${full?"傳送<br>➤":`還差<br>${left} 句`}</button></div>`;
  $("comp").querySelectorAll(".tile").forEach(b=>b.addEventListener("click",()=>{ if(busy) return; pick[+b.dataset.s]=+b.dataset.k; Music.sfx("tap"); renderComp(); }));
  const sb=$("send"); if(sb) sb.addEventListener("click",send);
}

async function send(){
  if(busy) return; busy=true; tries++;
  const L=LV[cur], text=msgText().join(" ");
  Music.sfx("send");
  renderComp();
  const chat=$("chat");
  const me=document.createElement("div"); me.className="row me"; me.innerHTML=`<span class="read" id="rdc"></span><div class="bub">${text}</div>`;
  chat.appendChild(me); chat.scrollTop=1e9;
  L.readers.forEach((_,k)=>{ $("md"+k).textContent=""; $("rd"+k).className="rd"; });
  // 計分
  const sc=L.readers.map((_,r)=>pick.reduce((a,p,s)=>a+L.slots[s][p][1][r][0],0));
  // 每位讀者挑出最強烈的解讀
  const os=L.readers.map((_,r)=>{
    let best=null; pick.forEach((p,s)=>{ const v=L.slots[s][p][1][r]; if(v[1] && (!best || Math.abs(v[0])>Math.abs(best[0]))) best=v; });
    return best;
  });
  const order=L.readers.map((_,k)=>k).sort(()=>Math.random()-.5);
  let n=0;
  for(const r of order){
    await sleep(650);
    n++; $("rdc").textContent=`已讀 ${n}`;
    const [cls,face]=moodOf(sc[r]);
    $("rd"+r).className="rd "+cls; $("md"+r).textContent=face;
    const line = os[r] ? os[r][1] : (sc[r]>=1?"聖誕快樂！":sc[r]===0?"（已讀）":"……");
    const tail = sc[r]>=2?" 😍":sc[r]===1?" 😊":sc[r]===0?"":" 😠";
    const row=document.createElement("div"); row.className="row";
    row.innerHTML=`<div class="a">${L.readers[r][1]}</div><div><div class="nm">${L.readers[r][0]}</div><div class="bub">${line}${tail}</div></div>`;
    chat.appendChild(row); chat.scrollTop=1e9; try{ row.scrollIntoView({behavior:"smooth",block:"nearest"}); }catch(e){} Music.sfx("pop");
  }
  await sleep(700);
  const allHappy=sc.every(v=>v>=1), noAngry=sc.every(v=>v>=0);
  const stars = allHappy?3:noAngry?2:0;
  const angry = L.readers.filter((_,r)=>sc[r]<0).map(x=>x[0]);
  if(stars){ results[cur]={stars,tries,text}; }
  Music.sfx(stars===3?"win":stars===2?"ok":"fail");
  sheet(stars, angry);
}

function sheet(stars, angry){
  const last = cur===LV.length-1;
  const s=$("sheet");
  if(stars===3){
    s.innerHTML=`<div class="stars">⭐⭐⭐</div><h2>全員開心！</h2><p>群組外交大成功，傳了 ${tries} 次就讓所有人都滿意。</p>
      <button class="btn" id="nx">${last?"看總成績 🎄":"下一個群組 ➤"}</button><button class="btn ghost" id="rt">再挑戰別的說法</button>`;
  } else if(stars===2){
    s.innerHTML=`<div class="stars">⭐⭐<span style="opacity:.2">⭐</span></div><h2>沒人生氣，但有人無感</h2><p>過關了！想拿三星，就要讓每個人都開心。</p>
      <button class="btn" id="nx">${last?"看總成績 🎄":"下一個群組 ➤"}</button><button class="btn ghost" id="rt">再試一次拿三星</button>`;
  } else {
    s.innerHTML=`<div class="stars">💥</div><h2>群組炸了</h2><p>${angry.join("、")} 誤會了你的意思……<br>看看他們的回覆，換個說法再試一次。</p>
      <button class="btn" id="rt">收回訊息，重新編輯</button>`;
  }
  s.classList.add("show");
  setTimeout(()=>{ try{ s.scrollIntoView({behavior:"smooth",block:"end"}); }catch(e){} },60);
  if($("nx")) $("nx").onclick=()=>{ Music.sfx("tap"); last? final() : load(cur+1); };
  $("rt").onclick=()=>{ Music.sfx("tap"); s.classList.remove("show"); busy=false; renderComp(); try{ $("comp").scrollIntoView({behavior:"smooth",block:"start"}); }catch(e){} };
}

function final(){
  const total=results.reduce((a,r)=>a+(r?r.stars:0),0), tt=results.reduce((a,r)=>a+(r?r.tries:0),0);
  const title= total>=9?"群組外交官":total>=7?"訊息公關達人":total>=6?"安全下莊的人":"建議已讀不回";
  const s=$("sheet");
  s.innerHTML=`<div class="final">
    <div style="font-size:13px;color:var(--muted);letter-spacing:.2em">總成績</div>
    <div class="big">⭐ ${total} / 9</div>
    <div class="tt">${title}</div>
    <div class="lvls">${LV.map((L,i)=>`<div>${L.icon} ${L.name.slice(0,4)}<b>${"⭐".repeat(results[i]?results[i].stars:0)}</b>傳了 ${results[i]?results[i].tries:0} 次</div>`).join("")}</div>
    <button class="btn" id="sh">複製戰績，考考朋友 🎄</button>
    <button class="btn ghost" id="again">從第一關重新開始</button>
    <div style="font-size:11px;color:var(--muted);margin-top:12px">純屬虛構娛樂・© 2026 liva</div></div>`;
  s.classList.add("show");
  setTimeout(()=>{ try{ s.scrollIntoView({behavior:"smooth",block:"start"}); }catch(e){} },60);
  $("again").onclick=()=>{ results=[]; load(0); };
  $("sh").onclick=async()=>{
    const txt=`我在《聖誕祝福，不准誤會》拿到 ${total}/9 顆星，稱號「${title}」🎄\n總共傳了 ${tt} 次訊息才讓所有群組沒人誤會。\n家族群組最難，你敢挑戰嗎？${shareUrl()}`;
    try{ await navigator.clipboard.writeText(txt); toast("已複製！貼給朋友比比看 🎄"); }catch(e){ toast("無法自動複製，截圖分享也可以 📸"); }
  };
}
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2400); }
$("go").onclick=()=>{ $("cover").style.display="none"; Music.start(); Music.sfx("win"); load(0); };
document.addEventListener("visibilitychange",()=>Music.pause(document.hidden));
</script>
</body>
</html>
