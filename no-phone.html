<style>
:root{--gold:#f4c95d;--red:#e3263f;--text:#f5f2ee;--muted:#9fb0c4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--text);background:#05070f;user-select:none;-webkit-user-select:none;touch-action:none}
.stage{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;
  background:linear-gradient(180deg,#070b1d 0%,#121a3a 55%,#243063 100%)}
canvas#snow{position:absolute;inset:0;z-index:3;pointer-events:none}

/* scenery */
.moon{position:absolute;top:9%;right:12%;width:64px;height:64px;border-radius:50%;background:#fff6d8;box-shadow:0 0 40px 10px #fff6d855;z-index:1}
.aurora{position:absolute;top:0;left:-20%;right:-20%;height:38%;z-index:0;opacity:0;transition:opacity 4s;
  background:radial-gradient(ellipse at 30% 40%,#2fbf7166,transparent 55%),radial-gradient(ellipse at 70% 30%,#7b6bff55,transparent 55%);filter:blur(18px);animation:aur 9s ease-in-out infinite alternate}
@keyframes aur{to{transform:translateX(8%) skewX(-6deg)}}
.ground{position:absolute;left:0;right:0;bottom:0;height:9%;z-index:4;background:linear-gradient(#f4f8ff,#d7e2f5);border-radius:50% 50% 0 0/30px 30px 0 0;transition:height 1.2s ease}
.item{position:absolute;z-index:5;opacity:0;transform:scale(.3) translateY(20px);transition:opacity .9s,transform .9s cubic-bezier(.2,1.5,.4,1)}
.item.on{opacity:1;transform:none}
.cabin{bottom:13%;left:50%;margin-left:-60px;font-size:104px;line-height:1;filter:brightness(.45);transition:filter 2s,opacity .9s,transform .9s}
.cabin.on{opacity:1;transform:none}
.cabin.warm{filter:brightness(1) drop-shadow(0 0 26px #ffb84d)}
.tree{bottom:12%;right:6%;font-size:110px;line-height:1;filter:grayscale(1) brightness(.5);transition:filter 2s,opacity .9s,transform .9s}
.tree.lit{filter:drop-shadow(0 0 18px #f4c95daa) saturate(1.3)}
.snowman{bottom:11%;left:7%;width:84px;height:130px}
.snowman i{position:absolute;left:50%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#dbe6f7);transform:translateX(-50%)}
.snowman .b1{bottom:0;width:84px;height:84px}
.snowman .b2{bottom:66px;width:58px;height:58px}
.snowman .eye{background:#222;width:7px;height:7px;bottom:96px}
.snowman .e1{margin-left:-9px}.snowman .e2{margin-left:9px}
.snowman .nose{bottom:86px;width:16px;height:6px;border-radius:0 50% 50% 0;background:#ff8a3d;margin-left:9px}
.snowman .hat{bottom:116px;width:40px;height:22px;border-radius:5px 5px 2px 2px;background:var(--red)}
.cat{bottom:10.5%;left:46%;font-size:40px}
.cocoa{bottom:11%;left:30%;font-size:38px}
.cocoa::before{content:"";position:absolute;left:10px;top:-22px;width:6px;height:20px;border-radius:50%;background:#ffffff55;filter:blur(2px);animation:steam 2s infinite}
@keyframes steam{from{transform:translateY(6px);opacity:0}50%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.gift{bottom:10%;right:34%;font-size:46px}
.sleigh{position:absolute;top:17%;left:-160px;z-index:2;font-size:34px;white-space:nowrap;display:none}
.sleigh.on{display:block;animation:fly 11s linear infinite}
@keyframes fly{from{left:-160px;transform:translateY(0)}50%{transform:translateY(-18px)}to{left:110%;transform:translateY(6px)}}

/* HUD */
.hud{position:absolute;top:0;left:0;right:0;z-index:8;text-align:center;padding-top:calc(env(safe-area-inset-top) + 26px);pointer-events:none;transition:opacity .5s}
.time{font-family:"Noto Serif TC",serif;font-weight:900;font-size:56px;letter-spacing:.04em;text-shadow:0 4px 24px #000a;font-variant-numeric:tabular-nums}
.next{font-size:13px;color:var(--muted);margin-top:2px}
.next b{color:var(--gold)}
.dont{position:absolute;bottom:3%;left:0;right:0;text-align:center;z-index:8;font-size:12px;color:#5f6b85;letter-spacing:.2em;pointer-events:none}

/* temptations */
.notif{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 10px);z-index:20;display:flex;gap:11px;align-items:center;
  background:rgba(245,245,248,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#111;border-radius:18px;padding:11px 13px;
  box-shadow:0 10px 30px #0008;transform:translateY(-140%);transition:transform .45s cubic-bezier(.2,1.2,.4,1)}
.notif.show{transform:none}
.notif .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:22px;flex:none;background:#fff}
.notif .tx{flex:1;min-width:0}
.notif .tx b{display:block;font-size:14px}
.notif .tx span{display:block;font-size:14px;color:#333;line-height:1.4}
.notif .now{font-size:11px;color:#777;align-self:flex-start}
.bug{position:absolute;z-index:19;font-size:26px;pointer-events:none;display:none}
.bug.on{display:block}
.overlay{position:absolute;inset:0;z-index:21;display:none;align-items:center;justify-content:center;padding:28px}
.overlay.on{display:flex}
.fake{background:#fff;color:#111;border-radius:22px;padding:24px 22px;text-align:center;width:100%;max-width:330px;box-shadow:0 20px 50px #000a;animation:popin .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.fake h3{font-size:22px;margin:6px 0 6px}
.fake p{font-size:14px;color:#555;line-height:1.6}
.fake .fb{margin-top:16px;background:var(--red);color:#fff;border-radius:12px;padding:13px;font-weight:700}
.dim{position:absolute;inset:0;z-index:18;background:#000;opacity:0;pointer-events:none;transition:opacity 2.5s}
.dim.on{opacity:.82}
.dimmsg{position:absolute;left:0;right:0;top:44%;z-index:19;text-align:center;font-size:15px;color:#aaa;display:none}
.dimmsg.on{display:block}
.shake{animation:shk .5s 3}
@keyframes shk{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}

/* panels */
.panel{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:center;padding:26px 22px;background:linear-gradient(180deg,#05070fcc,#05070ff2 60%);overflow-y:auto;touch-action:pan-y}
.panel.hide{display:none}
.k{font-size:12px;letter-spacing:.3em;color:var(--gold);text-align:center}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:44px;line-height:1.25;text-align:center;margin:12px 0 14px}
h1 em{font-style:normal;color:var(--red)}
.lead{text-align:center;color:#c9d3e4;line-height:1.9;font-size:15.5px}
.rules{margin:20px 0 22px;background:#ffffff0c;border:1px solid #ffffff1c;border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.95;color:#d5dceb}
.rules b{color:var(--gold)}
.btn{display:block;width:100%;font:inherit;font-weight:700;font-size:17px;border:0;border-radius:14px;padding:15px;background:var(--red);color:#fff;cursor:pointer;box-shadow:0 8px 24px #e3263f55}
.btn.ghost{background:transparent;border:1px solid #ffffff33;box-shadow:none;margin-top:9px}
.foot{text-align:center;font-size:11px;color:#5f6b85;margin-top:16px;line-height:1.8}
.res-time{font-family:"Noto Serif TC",serif;font-weight:900;font-size:64px;text-align:center;line-height:1.1;margin-top:6px}
.rank{text-align:center;font-size:24px;font-weight:900;color:var(--gold);margin:8px 0 4px}
.rank-d{text-align:center;color:#c9d3e4;font-size:14.5px;line-height:1.7;margin-bottom:16px}
.box{background:#ffffff0d;border:1px solid #ffffff1f;border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14.5px;line-height:1.7}
.box h4{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:3px}
.box .killer{font-size:17px;font-weight:700}
.unl{display:flex;flex-wrap:wrap;gap:6px}
.unl span{font-size:13px;padding:4px 10px;border-radius:99px;background:#ffffff14}
.unl span.no{opacity:.3}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);opacity:0;background:#fff;color:#111;padding:9px 16px;border-radius:99px;font-size:14px;transition:.3s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="aurora" id="aurora"></div>
  <div class="moon"></div>
  <div class="sleigh" id="sleigh">🦌🦌🛷🎅</div>
  <canvas id="snow"></canvas>
  <div class="item cabin on" id="cabin">🏠</div>
  <div class="item tree on" id="tree">🎄</div>
  <div class="item snowman" id="snowman"><i class="b1"></i><i class="b2"></i><i class="eye e1"></i><i class="eye e2"></i><i class="nose"></i><i class="hat"></i></div>
  <div class="item cocoa" id="cocoa">☕</div>
  <div class="item cat" id="cat">🐈</div>
  <div class="item gift" id="gift">🎁</div>
  <div class="ground" id="ground"></div>

  <div class="hud" id="hud" style="opacity:0"><div class="time" id="time">00:00</div><div class="next" id="next"></div></div>
  <div class="dont" id="dont" style="display:none">不 准 碰 螢 幕</div>

  <div class="dim" id="dim"></div><div class="dimmsg" id="dimmsg">螢幕即將關閉……點一下保持開啟</div>
  <div class="bug" id="bug">🪲</div>
  <div class="notif" id="notif"><div class="ic" id="nic"></div><div class="tx"><b id="nt"></b><span id="nb"></span></div><div class="now">現在</div></div>
  <div class="overlay" id="ov"><div class="fake" id="fake"></div></div>

  <div class="panel" id="cover">
    <div class="k">平安夜限定挑戰</div>
    <h1>聖誕夜，<br><em>不准滑。</em></h1>
    <p class="lead">按下開始後，<b>不要再碰你的手機</b>。<br>撐得越久，窗外的聖誕夜就越美。<br>但你的手機……會想盡辦法讓你點下去。</p>
    <div class="rules">
      📵 碰到螢幕、按任何鍵、切到別的 App，就算輸<br>
      🔔 會有各種「通知」來誘惑你，<b>都是假的</b><br>
      🔊 建議開聲音，手機放桌上就好<br>
      🍗 聚餐玩法：大家一起開始，<b>第一個碰手機的請客</b>
    </div>
    <button class="btn" id="go">開始（之後別再碰我）</button>
    <div class="foot">純屬虛構娛樂・不讀取、不儲存任何資料・© 2026 liva</div>
  </div>
  <div class="panel hide" id="result"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const shareUrl = () => /claude|anthropic|usercontent/.test(location.hostname) || location.protocol==="file:" ? "" : "\n"+location.origin+location.pathname;
const $ = id => document.getElementById(id);
const WIN = 300;

/* ---------- 誘惑清單 [秒, 類型, icon, 標題, 內容, 敗因名稱] ---------- */
const TEMPT = [
  [4,"n","📦","物流通知","你的包裹已送達，請盡快取件","📦 包裹已送達"],
  [9,"n","💬","小君","欸你在嗎？","💬 朋友的「在嗎」"],
  [15,"n","🔥","限時快閃","全館 1 折！倒數 30 秒，手慢無！","🔥 限時 1 折"],
  [21,"n","❤️","社群","有 3 個人對你的限動按讚","❤️ 限動按讚通知"],
  [28,"n","🔋","系統","電量剩 5%，點此開啟省電模式","🔋 電量剩 5%"],
  [36,"n","👀","社群","你的前任剛剛查看了你的限動","👀 前任看了你的限動"],
  [45,"n","💼","主管","明天的會議可以提早到 8 點嗎？","💼 主管的訊息"],
  [54,"bug","","","","🪲 螢幕上的蟲"],
  [63,"n","📸","回憶","2016 年的今天：你有一則回憶","📸 2016 年的回憶"],
  [72,"n","🎁","恭喜中獎","你被選為今天的幸運兒！點此領取","🎁 假中獎通知"],
  [82,"n","💬","群組（99+）","大家快看這個！！！笑死","💬 群組 99+"],
  [92,"dim","","","","🌑 螢幕即將關閉"],
  [104,"n","🧵","脆","有人在貼文中提到了你","🧵 有人提到你"],
  [115,"n","💬","媽媽","你吃飯了沒？怎麼都不回","💬 媽媽的訊息"],
  [126,"n","🎅","聖誕老人","我到你家門口了，幫我開一下門","🎅 聖誕老人敲門"],
  [138,"shake","","","","📳 手機一直震"],
  [150,"fake","🎉","挑戰成功！","你已撐過 2 分 30 秒，點擊領取你的結果","🎉 假的「挑戰成功」"],
  [165,"n","❓","你還在嗎？","畫面靜止太久了，點一下確認你還活著","❓ 「你還在嗎？」"],
  [180,"n","🔑","生活","你出門的時候……有鎖門嗎？","🔑 有沒有鎖門"],
  [195,"n","💸","帳戶通知","你有一筆款項入帳：NT$ 88,888","💸 假的入帳通知"],
  [210,"fake","⚠️","系統錯誤","遊戲發生錯誤，請點擊重新整理以保留紀錄","⚠️ 假的系統錯誤"],
  [226,"n","💔","小君","其實我一直想跟你說……","💔 小君的告白"],
  [242,"bug","","","","🪲 又一隻蟲"],
  [258,"n","🛍️","購物車","你購物車裡的商品快賣完了！","🛍️ 購物車快完售"],
  [272,"fake","🏆","你贏了！","真的，這次是真的，可以點了","🏆 「這次是真的」"],
  [288,"n","🫠","最後 12 秒","你確定不想看一下手機嗎？","🫠 最後的誘惑"]
];
const SCENE = [
  [0,"❄️ 初雪"],[30,"⛄ 雪人"],[60,"🎄 聖誕樹點燈"],[90,"🏠 小屋亮燈"],
  [120,"🐈 睡著的貓"],[150,"☕ 熱可可"],[180,"🛷 聖誕老人飛過"],[240,"🌌 極光"],[300,"🎁 聖誕禮物"]
];
const RANKS = [
  [10,"手機本體","你的手指比你的大腦先動。建議檢查一下手機是不是長在手上。"],
  [30,"重度滑手機患者","撐不過 30 秒，但至少你很誠實。"],
  [60,"標準現代人","跟大部分人一樣，一個通知就把你帶走了。"],
  [120,"定力不錯的人類","你已經贏過大多數朋友了，可以去嗆他們。"],
  [180,"聖誕禪師","心如止水，看著通知來來去去，你只看見雪。"],
  [300,"北極級定力","連聖誕老人敲門都叫不動你，你是真的放得下。"],
  [9999,"傳說中放得下手機的人","整整 5 分鐘。你守住了整個聖誕夜。"]
];

let st="cover", t0=0, raf=0, ti=0, last=null, armed=false, wake=null, actx=null, timers=[];

function fmt(s){ s=Math.floor(s); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function ding(){
  try{
    if(!actx) return;
    const o=actx.createOscillator(), g=actx.createGain();
    o.type="sine"; o.frequency.setValueAtTime(1046,actx.currentTime); o.frequency.setValueAtTime(1318,actx.currentTime+.09);
    g.gain.setValueAtTime(.0001,actx.currentTime); g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+.02); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.5);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+.55);
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([120,60,120]); }catch(e){}
}

async function start(){
  try{ actx = new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){}
  try{ if(navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); }catch(e){}
  resetScene();
  $("cover").classList.add("hide"); $("result").classList.add("hide");
  $("hud").style.opacity=1; $("dont").style.display="block";
  st="play"; t0=performance.now(); ti=0; last=null; armed=false;
  setTimeout(()=>armed=true, 700);
  loop();
}

function loop(){
  const s=(performance.now()-t0)/1000;
  $("time").textContent=fmt(s);
  const nx=SCENE.find(x=>x[0]>s);
  $("next").innerHTML = nx ? `再撐 <b>${Math.ceil(nx[0]-s)}</b> 秒解鎖 ${nx[1]}` : "";
  updateScene(s);
  while(ti<TEMPT.length && TEMPT[ti][0]<=s){ fire(TEMPT[ti], s); ti++; }
  if(s>=WIN) return end("win");
  raf=requestAnimationFrame(loop);
}

function updateScene(s){
  $("ground").style.height = (9 + Math.min(s,WIN)/WIN*13)+"%";
  const on=(id,c="on")=>$(id).classList.add(c);
  if(s>=30) on("snowman");
  if(s>=60) on("tree","lit");
  if(s>=90) on("cabin","warm");
  if(s>=120) on("cat");
  if(s>=150) on("cocoa");
  if(s>=180) on("sleigh");
  if(s>=240) $("aurora").style.opacity=1;
  if(s>=300) on("gift");
  snowRate = 1 + Math.min(s,WIN)/WIN*1.6;
}
function resetScene(){
  ["snowman","cat","cocoa","gift","sleigh"].forEach(i=>$(i).classList.remove("on"));
  $("tree").classList.remove("lit"); $("cabin").classList.remove("warm");
  $("aurora").style.opacity=0; $("ground").style.height="9%"; snowRate=1;
  clearTemptUI();
}
function clearTemptUI(){
  timers.forEach(clearTimeout); timers=[];
  $("notif").classList.remove("show"); $("ov").classList.remove("on");
  $("bug").classList.remove("on"); $("dim").classList.remove("on"); $("dimmsg").classList.remove("on");
  $("stage").classList.remove("shake");
}
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));

function fire(T, s){
  const [,type,ic,title,body,name]=T;
  last={name, at:s};
  if(type==="n"){
    $("nic").textContent=ic; $("nt").textContent=title; $("nb").textContent=body;
    $("notif").classList.add("show"); ding();
    later(()=>$("notif").classList.remove("show"), 4200);
  } else if(type==="bug"){
    const b=$("bug"); b.classList.add("on");
    let x=-30, y=window.innerHeight*0.55, a=0;
    const w=Math.min(window.innerWidth,520);
    const step=()=>{ if(st!=="play"||!b.classList.contains("on")) return;
      x+=1.6; a+=.08; y+=Math.sin(a)*1.4;
      b.style.left=x+"px"; b.style.top=y+"px"; b.style.transform=`rotate(${90+Math.sin(a)*25}deg)`;
      if(x<w+30) requestAnimationFrame(step); else b.classList.remove("on"); };
    step();
  } else if(type==="dim"){
    $("dim").classList.add("on"); later(()=>$("dimmsg").classList.add("on"),1200);
    later(()=>{ $("dim").classList.remove("on"); $("dimmsg").classList.remove("on"); }, 6500);
  } else if(type==="shake"){
    $("stage").classList.add("shake"); ding(); later(ding,600); later(ding,1200);
    later(()=>$("stage").classList.remove("shake"), 1700);
  } else if(type==="fake"){
    $("fake").innerHTML=`<div style="font-size:44px">${ic}</div><h3>${title}</h3><p>${body}</p><div class="fb">點我</div>`;
    $("ov").classList.add("on"); ding();
    later(()=>$("ov").classList.remove("on"), 6000);
  }
}

function lose(reason){
  if(st!=="play" || !armed) return;
  const s=(performance.now()-t0)/1000;
  let killer;
  if(reason==="hidden") killer="📱 偷偷切到別的 App";
  else if(last && s-last.at<6) killer=last.name;
  else killer="🤚 單純手癢";
  end("lose", killer);
}

function end(kind, killer){
  st="end"; cancelAnimationFrame(raf);
  const s=Math.min((performance.now()-t0)/1000, WIN);
  clearTemptUI();
  try{ wake && wake.release(); }catch(e){}
  $("hud").style.opacity=0; $("dont").style.display="none";
  const r=RANKS.find(x=>s<x[0]) || RANKS[RANKS.length-1];
  const unl=SCENE.map(([t,n])=>`<span class="${s>=t?"":"no"}">${n}</span>`).join("");
  const got=SCENE.filter(x=>s>=x[0]).length;
  const win = kind==="win";
  $("result").innerHTML=`
    <div class="k">${win?"挑戰成功・你守住了聖誕夜":"你碰了手機"}</div>
    <div class="res-time">${fmt(s)}</div>
    <div class="rank">${r[1]}</div>
    <div class="rank-d">${r[2]}</div>
    <div class="box"><h4>${win?"你抵抗了所有誘惑":"擊敗你的是"}</h4><div class="killer">${win?"🏆 全部 26 種誘惑":killer}</div></div>
    <div class="box"><h4>解鎖的聖誕夜景（${got}/${SCENE.length}）</h4><div class="unl">${unl}</div></div>
    <button class="btn" id="sh" style="margin-top:8px">複製戰績，嗆朋友 🔥</button>
    <button class="btn ghost" id="again">再挑戰一次</button>
    <div class="foot">純屬虛構娛樂・不讀取、不儲存任何資料・© 2026 liva</div>`;
  $("result").classList.remove("hide");
  $("again").onclick=()=>start();
  $("sh").onclick=async()=>{
    const txt = win
      ? `我在《聖誕夜，不准滑。》整整 5 分鐘沒碰手機 🏆\n稱號：${r[1]}\n你撐得過嗎？🎄${shareUrl()}`
      : `我在《聖誕夜，不准滑。》撐了 ${fmt(s)} 就碰手機了 📵\n擊敗我的是：${killer}\n稱號：${r[1]}\n你撐得過嗎？🎄${shareUrl()}`;
    try{ await navigator.clipboard.writeText(txt); toast("已複製！貼給朋友，看誰撐比較久 🎄"); }
    catch(e){ toast("無法自動複製，截圖分享也可以 📸"); }
  };
}

/* 任何互動 = 輸 */
["pointerdown","touchstart","keydown","wheel"].forEach(ev=>window.addEventListener(ev,e=>{
  if(st==="play"){ e.preventDefault(); lose("touch"); }
},{capture:true,passive:false}));
document.addEventListener("visibilitychange",()=>{ if(document.hidden) lose("hidden"); });
window.addEventListener("blur",()=>{ if(st==="play") lose("hidden"); });

$("go").onclick=start;

/* snow */
const cv=$("snow"), ctx=cv.getContext("2d"); let flakes=[], snowRate=1;
function resize(){
  const w=$("stage").clientWidth, h=$("stage").clientHeight, d=devicePixelRatio||1;
  cv.width=w*d; cv.height=h*d; cv.style.width=w+"px"; cv.style.height=h+"px"; ctx.setTransform(d,0,0,d,0,0);
  flakes=Array.from({length:140},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2.4+.7,s:Math.random()*.7+.3,d:Math.random()*6.28}));
}
function snow(){
  const w=$("stage").clientWidth, h=$("stage").clientHeight;
  ctx.clearRect(0,0,w,h); ctx.fillStyle="rgba(255,255,255,.85)";
  const n=Math.floor(flakes.length*Math.min(1,.45+snowRate*.3));
  for(let i=0;i<n;i++){ const f=flakes[i];
    f.y+=f.s*snowRate; f.d+=.01; f.x+=Math.sin(f.d)*.4;
    if(f.y>h){ f.y=-4; f.x=Math.random()*w; }
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,6.28); ctx.fill(); }
  requestAnimationFrame(snow);
}
addEventListener("resize",resize); resize(); snow();

function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2400); }
</script>
